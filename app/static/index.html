<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容证据核查工作台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      内容证据核查工作台
    </div>
    <nav class="mode-switch" aria-label="工作台入口">
      <a class="mode" href="/workbench">内容研判</a>
      <a class="mode" href="/agent">待复核队列</a>
      <a class="mode active" href="/">评测与版本</a>
      <a class="mode" href="/tools">工具与语料</a>
    </nav>
    <div class="topbar-controls">
      <label for="run-select">运行</label>
      <select id="run-select"></select>
      <label class="toggle" for="only-comparable">
        <input type="checkbox" id="only-comparable" checked>
        只看可比较
      </label>
      <span id="run-badges" class="badges"></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="视图">
    <button class="tab active" type="button" role="tab" data-view="review" aria-selected="true">核查</button>
    <button class="tab" type="button" role="tab" data-view="trace" aria-selected="false">运行 Trace</button>
    <button class="tab" type="button" role="tab" data-view="compare" aria-selected="false">版本对比</button>
  </nav>

  <main>
    <p class="entry-hint muted small">
      这一页是给 Agent 维护者看的：**核查**看一次评测跑得怎么样、**运行 Trace** 看每次模型调用干了什么、
      **版本对比**看两次运行之间差在哪几条主张上。日常处理内容请从上方「处理内容」进入；
      想看 Agent 能调用什么、语料里有什么，去「工具与语料」。
    </p>
    <section id="view-review" class="view"></section>
    <section id="view-trace" class="view" hidden></section>
    <section id="view-compare" class="view" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
